<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta restaurante con rieles</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe7ee; font-family: system-ui, sans-serif; }
  #hint { position: fixed; left: 12px; bottom: 10px; font-size: 12px; color: #445; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint">Arrastra para orbitar · rueda para zoom · clic derecho para desplazar</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ---- parámetros (metros) ----
const P = {
  ancho: 15, fondo: 12, cocina: 3, ventana: 2.4, alturaRiel: 2.6,
  filas: 3, columnas: 4, mesa: 1.1,
  velocidad: 2.5,
  duracion: 15, 'grabar video': record,
};
const hint = document.getElementById('hint');

const SKIN = 0xffd500, RAIL = 0x444b55, FLOOR = 0xe4cd9e;
const COLORS = [0xc91a09, 0x0055bf, 0x237841, 0xfe8a18, 0x078bc9, 0x923978, 0xf4f4f4, 0x1b2a34];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe7ee);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(6, 11, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.05;

// ---- helpers de piezas ----
let world, tables, carts, L, queue, trunkBusy;
const mats = {};
const mat = c => mats[c] ??= new THREE.MeshStandardMaterial({ color: c, roughness: 0.35 });
function add(geo, c, x, y, z, parent = world) {
  const m = new THREE.Mesh(geo, mat(c));
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d, c, x, y, z, p) => add(new THREE.BoxGeometry(w, h, d), c, x, y, z, p);
const cyl = (r, h, c, x, y, z, p) => add(new THREE.CylinderGeometry(r, r, h, 20), c, x, y, z, p);
// paredes del túnel translúcidas para seguir la comida desde cualquier ángulo; opacity: 1 las deja opacas
const TUNNEL = 0xcfd6dd, GLASS = new THREE.MeshStandardMaterial({ color: 0x9fd3ff, transparent: true, opacity: 0.35, roughness: 0.1, depthWrite: false });
const pane = (w, h, d, x, y, z) => { const m = box(w, h, d, TUNNEL, x, y, z); m.material = GLASS; m.castShadow = false; };
function spans(a, b, cuts, half) { // tramos de [a, b] que quedan al abrir un hueco de ±half en cada corte
  const out = []; let s = a;
  for (const c of [...cuts].sort((p, q) => p - q)) { if (c - half > s) out.push([s, c - half]); s = Math.max(s, c + half); }
  if (b > s) out.push([s, b]);
  return out;
}
console.assert(JSON.stringify(spans(0, 10, [5, 1], 1)) === '[[2,4],[6,10]]', 'spans');
const v3 = (x, z) => new THREE.Vector3(x, 0, z);
const ease = t => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
function rng(seed) { // mulberry32: la decoración no cambia al mover un slider
  return () => { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = (rnd, a) => a[Math.floor(rnd() * a.length)];

function minifig(rnd, seated, chef) {
  const g = new THREE.Group();
  const shirt = chef ? 0xffffff : pick(rnd, COLORS), pants = chef ? 0x1b2a34 : pick(rnd, COLORS);
  const legs = new THREE.Group(); g.add(legs);
  for (const s of [-1, 1]) box(0.2, 0.5, 0.24, pants, s * 0.11, -0.25, 0, legs);
  if (seated) legs.rotation.x = -Math.PI / 2; // como el muñeco real: la pierna gira entera en la cadera
  box(0.44, 0.1, 0.24, pants, 0, 0.05, 0, g);
  box(0.46, 0.45, 0.26, shirt, 0, 0.325, 0, g);
  for (const s of [-1, 1]) {
    const arm = new THREE.Group();
    arm.position.set(s * 0.3, 0.52, 0);
    arm.rotation.x = seated ? -1.1 : -0.3;
    g.add(arm);
    box(0.12, 0.38, 0.14, shirt, 0, -0.19, 0, arm);
    cyl(0.06, 0.1, SKIN, 0, -0.42, 0, arm);
  }
  cyl(0.16, 0.26, SKIN, 0, 0.69, 0, g);
  if (chef) cyl(0.17, 0.24, 0xffffff, 0, 0.93, 0, g); else cyl(0.08, 0.06, SKIN, 0, 0.85, 0, g);
  for (const s of [-1, 1]) add(new THREE.SphereGeometry(0.022, 8, 8), 0x111111, s * 0.06, 0.72, 0.155, g);
  add(new THREE.TorusGeometry(0.055, 0.01, 6, 12, Math.PI), 0x111111, 0, 0.67, 0.158, g).rotation.z = Math.PI;
  g.position.y = seated ? 0.57 : 0.5;
  return g;
}

function dish(rnd, parent) {
  const g = new THREE.Group(); parent.add(g);
  cyl(0.14, 0.02, 0xffffff, 0, 0.03, 0, g);
  add(new THREE.SphereGeometry(0.09, 12, 8), pick(rnd, [0xc91a09, 0x237841, 0xfe8a18, 0x8b5a2b]), 0, 0.05, 0, g).scale.y = 0.6;
  return g;
}

function label(n) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(64, 64, 58, 0, 7); ctx.fill();
  ctx.lineWidth = 8; ctx.strokeStyle = '#c91a09'; ctx.stroke();
  ctx.fillStyle = '#111'; ctx.font = 'bold 72px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(n, 64, 68);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
  s.scale.setScalar(0.5);
  return s;
}

// ---- construir toda la maqueta desde P ----
function build() {
  if (world) {
    scene.remove(world);
    world.traverse(o => { if (o.isMesh) o.geometry.dispose(); if (o.isSprite) { o.material.map.dispose(); o.material.dispose(); } });
  }
  world = new THREE.Group(); scene.add(world);
  const rnd = rng(7);
  const W = P.ancho, D = P.fondo, H = P.alturaRiel, K = Math.min(P.cocina, W - 5);
  const trunkX = -W / 2 + K, wallH = H + 0.6; // trunkX: x del riel troncal y del punto de carga, justo delante del muro de la cocina
  const dz = D / P.filas, rowZ = Array.from({ length: P.filas }, (_, r) => -D / 2 + dz * (r + 0.5));

  // suelo, paredes (solo dos, para ver dentro) y tetones
  box(W, 0.2, D, FLOOR, 0, -0.1, 0);
  box(K - 0.33, 0.02, D, 0xd9dde2, -W / 2 + (K - 0.33) / 2, 0.01, 0);
  box(W + 0.2, wallH, 0.2, 0xf4f4f4, -0.1, wallH / 2, -D / 2 - 0.1);
  box(0.2, wallH, D, 0xf4f4f4, -W / 2 - 0.1, wallH / 2, 0);
  const nx = Math.floor((W - K) / 0.5), nz = Math.floor(D / 0.5);
  const studs = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.09, 0.09, 0.05, 12), mat(FLOOR), nx * nz);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++)
    studs.setMatrixAt(i * nz + j, m4.makeTranslation(trunkX + 0.25 + i * 0.5, 0.025, -D / 2 + 0.25 + j * 0.5));
  studs.receiveShadow = true; world.add(studs);

  // cocina cerrada: muro con una sola ventana de pase (4 cajas alrededor del hueco); la repisa atraviesa la ventana y ahí cargan las canastas
  const wallX = trunkX - 0.4, win = Math.min(P.ventana, D - 1), side = (D - win) / 2;
  for (const s of [-1, 1]) box(0.15, wallH, side, 0xf4f4f4, wallX, wallH / 2, s * (win + side) / 2);
  box(0.15, 1.0, win, 0xf4f4f4, wallX, 0.5, 0);
  box(0.15, wallH - 1.9, win, 0xf4f4f4, wallX, (wallH + 1.9) / 2, 0);
  box(1.0, 0.08, win, 0xc91a09, trunkX - 0.2, 0.96, 0);
  box(0.8, 0.9, Math.min(D - 2, 4), 0x8a9099, -W / 2 + 0.5, 0.45, 0);
  for (const z of [-1, 0, 1]) cyl(0.15, 0.03, 0x222222, -W / 2 + 0.5, 0.915, z);
  for (const z of [-win / 4, win / 4]) {
    const chef = minifig(rnd, false, true);
    chef.position.x = wallX - 0.8; chef.position.z = z; chef.rotation.y = Math.PI / 2;
    world.add(chef);
  }

  // mesas numeradas
  const x0 = trunkX + 1.5, x1 = W / 2 - 0.8, dx = (x1 - x0) / P.columnas;
  const S = Math.max(0.5, Math.min(P.mesa, dx - 0.4, dz - 0.4));
  tables = [];
  for (const z of rowZ) {
    for (let c = 0; c < P.columnas; c++) {
      const x = x0 + dx * (c + 0.5);
      box(S, 0.08, S, 0xf4f4f4, x, 0.75, z);
      cyl(0.08, 0.71, RAIL, x, 0.355, z);
      cyl(0.015, 0.3, RAIL, x - S / 2 + 0.06, 0.94, z + S / 2 - 0.06);
      const tag = label(tables.length + 1);
      tag.position.set(x - S / 2 + 0.06, 1.3, z + S / 2 - 0.06);
      world.add(tag);
      for (const [sx, sz] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        if ((sx ? dx : dz) < S + 1.5) continue; // sin sitio para silla en ese lado
        const seat = new THREE.Group();
        seat.position.set(x + sx * (S / 2 + 0.3), 0, z + sz * (S / 2 + 0.3));
        seat.rotation.y = Math.atan2(-sx, -sz);
        world.add(seat);
        box(0.5, 0.08, 0.5, 0x0055bf, 0, 0.41, 0, seat);
        box(0.5, 0.5, 0.08, 0x0055bf, 0, 0.7, -0.29, seat);
        if (rnd() < 0.75) seat.add(minifig(rnd, true));
      }
      const plate = dish(rnd, world); plate.position.set(x, 0.79, z); plate.visible = false;
      tables.push({ x, z, plate });
    }
  }

  // rieles: troncal (eje z) pegado a la cocina + un ramal (eje x) por fila de mesas
  const zmin = Math.min(...rowZ, 0) - 0.4, zmax = Math.max(...rowZ, 0) + 0.4, xEnd = x1 - dx / 2 + 0.4;
  box(0.1, 0.1, zmax - zmin, RAIL, trunkX, H, (zmin + zmax) / 2);
  for (const z of [zmin, zmax]) cyl(0.05, H, RAIL, trunkX, H / 2, z);
  for (const z of rowZ) {
    box(xEnd - trunkX, 0.1, 0.1, RAIL, (trunkX + xEnd) / 2, H, z);
    cyl(0.05, H, RAIL, xEnd, H / 2, z);
  }

  // túnel térmico: canal en U alrededor del riel, abierto por arriba, con hueco en el suelo solo donde baja la canasta
  const fy = H - 0.58, wy = H - 0.25, colX = tables.slice(0, P.columnas).map(t => t.x);
  for (const [a, b] of spans(zmin, zmax, [0], 0.3)) box(0.6, 0.04, b - a, TUNNEL, trunkX, fy, (a + b) / 2);
  pane(0.03, 0.7, zmax - zmin, trunkX - 0.3, wy, (zmin + zmax) / 2);
  for (const [a, b] of spans(zmin, zmax, rowZ, 0.3)) pane(0.03, 0.7, b - a, trunkX + 0.3, wy, (a + b) / 2); // bocas hacia los ramales
  for (const z of [zmin, zmax]) pane(0.6, 0.7, 0.03, trunkX, wy, z);
  for (const z of rowZ) {
    for (const [a, b] of spans(trunkX + 0.3, xEnd, colX, 0.3)) box(b - a, 0.04, 0.6, TUNNEL, (a + b) / 2, fy, z);
    for (const s of [-1, 1]) pane(xEnd - trunkX - 0.3, 0.7, 0.03, (trunkX + 0.3 + xEnd) / 2, wy, z + s * 0.3);
    pane(0.03, 0.7, 0.6, xEnd, wy, z);
  }

  // un carrito por fila, aparcado dentro de su ramal, con canasta colgada de un cable
  L = { H, trunkX, home: v3(trunkX, 0) };
  carts = []; queue = []; trunkBusy = false;
  rowZ.forEach((z, r) => {
    const g = new THREE.Group(); world.add(g);
    box(0.3, 0.14, 0.3, 0xf2cd37, 0, H - 0.12, 0, g);
    const cable = cyl(0.012, 1, 0x222222, 0, 0, 0, g);
    const basket = new THREE.Group(); g.add(basket);
    box(0.4, 0.03, 0.4, 0xfe8a18, 0, 0, 0, basket);
    for (const [w, d, x, z] of [[0.4, 0.03, 0, 0.185], [0.4, 0.03, 0, -0.185], [0.03, 0.4, 0.185, 0], [0.03, 0.4, -0.185, 0]])
      box(w, 0.14, d, 0xfe8a18, x, 0.07, z, basket);
    const c = { g, cable, basket, food: dish(rnd, basket), phase: 'wait', park: v3(trunkX + 0.8, z),
      tables: tables.slice(r * P.columnas, (r + 1) * P.columnas) };
    g.position.copy(c.park); c.food.visible = false; setDrop(c, 0);
    carts.push(c); queue.push(c);
  });

  const R = Math.max(W, D);
  sun.position.set(W * 0.3, 14, D * 0.8);
  Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 1, far: 50 });
  sun.shadow.camera.updateProjectionMatrix();
}

// ---- animación: esperar turno → ir a la ventana → cargar → servir en su fila → volver a su ramal ----
// Cada carrito solo sirve su fila, así que en los ramales nunca se cruzan. El troncal y la ventana son el único
// tramo compartido: lo usa un carrito a la vez (trunkBusy) y `queue` reparte el turno por orden de llegada.
function setDrop(c, y) {
  const by = L.H - 0.5 - y, top = L.H - 0.19, len = top - (by + 0.14);
  c.basket.position.y = by;
  c.cable.scale.y = len;
  c.cable.position.y = top - len / 2;
}
function next(c) {
  c.t = 0; c.i = 0; c.done = false; c.path = null;
  const junction = v3(L.trunkX, c.park.z);
  if (c.phase === 'wait') { // le toca: ocupa el troncal y va a la ventana
    trunkBusy = true;
    c.table = c.tables[Math.floor(Math.random() * c.tables.length)];
    c.table.plate.visible = false; c.food.visible = false;
    c.phase = 'toHome'; c.path = [junction, L.home];
  } else if (c.phase === 'toHome') {
    c.phase = 'load'; c.depth = L.H - 1.53;
  } else if (c.phase === 'load') {
    c.phase = 'go'; c.path = [junction, c.park, v3(c.table.x, c.table.z)];
  } else if (c.phase === 'go') {
    c.phase = 'serve'; c.depth = L.H - 1.31;
  } else if (c.phase === 'serve') {
    c.phase = 'back'; c.path = [c.park];
  } else {
    c.phase = 'wait'; queue.push(c);
  }
  setDrop(c, 0);
}
function stepCart(c, dt) {
  const v = P.velocidad;
  if (c.phase === 'wait') { if (!trunkBusy && queue[0] === c) { queue.shift(); next(c); } return; }
  if (c.path) {
    const d = c.path[c.i].clone().sub(c.g.position), step = v * dt;
    if (d.length() <= step) {
      c.g.position.copy(c.path[c.i]);
      if (c.phase === 'go' && c.path[c.i] === c.park) trunkBusy = false; // ya entró en su ramal: libera el troncal
      if (++c.i >= c.path.length) next(c);
    } else c.g.position.add(d.setLength(step));
    return;
  }
  c.t += dt;
  const tDown = c.depth / (v * 0.5), hold = 0.8;
  if (c.t > tDown && !c.done) { // tocó fondo: cargar o entregar el plato
    c.done = true;
    c.food.visible = c.phase === 'load';
    if (c.phase === 'serve') c.table.plate.visible = true;
  }
  if (c.t > 2 * tDown + hold) return next(c);
  setDrop(c, c.depth * (c.t < tDown + hold ? ease(c.t / tDown) : 1 - ease((c.t - tDown - hold) / tDown)));
}

function record() { // MP4 (H.264) es lo que WhatsApp reproduce en el chat; WebM solo si el navegador no sabe codificar MP4
  const mime = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  // 5 Mbps: 25 s ≈ 15 MB, por debajo del límite clásico de 16 MB de WhatsApp
  const rec = new MediaRecorder(renderer.domElement.captureStream(30), { mimeType: mime, videoBitsPerSecond: 5e6 });
  const chunks = [], tip = hint.textContent;
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    hint.textContent = tip;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: mime }));
    a.download = 'restaurante.' + (mime.includes('mp4') ? 'mp4' : 'webm');
    a.click();
  };
  rec.start();
  hint.textContent = '● grabando ' + P.duracion + ' s… puedes mover la cámara';
  setTimeout(() => rec.stop(), P.duracion * 1000);
}

// ---- panel ----
const gui = new GUI({ title: 'Medidas (m)' });
for (const [k, a, b, s] of [['ancho', 8, 30, 0.5], ['fondo', 5, 20, 0.5], ['cocina', 2, 8, 0.5], ['ventana', 1, 5, 0.1], ['alturaRiel', 2.2, 4, 0.1],
  ['filas', 1, 5, 1], ['columnas', 1, 8, 1], ['mesa', 0.6, 2, 0.1]])
  gui.add(P, k, a, b, s).onChange(build);
gui.add(P, 'velocidad', 0.5, 8, 0.1);
gui.add(P, 'duracion', 5, 25, 1).name('duración vídeo (s)');
gui.add(P, 'grabar video');
// las medidas se quedan guardadas en el navegador entre recargas
try { gui.load(JSON.parse(localStorage.getItem('maqueta'))); } catch {}
gui.onFinishChange(() => localStorage.setItem('maqueta', JSON.stringify(gui.save())));

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
build();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const c of carts) stepCart(c, dt);
  for (const a of carts) for (const b of carts) // chequeo: dos carritos nunca en el mismo sitio
    console.assert(a === b || a.g.position.distanceTo(b.g.position) > 0.45, 'choque de carritos');
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
